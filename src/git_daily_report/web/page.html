<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EOM 周报</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #fff; --ink: #1a1d21; --muted: #6b7280;
    --line: #e3e6ea; --accent: #2563eb; --warn: #b91c1c; --warn-bg: #fef2f2;
    --ok: #15803d; --ok-bg: #f0fdf4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --card: #1e2126; --ink: #e6e8ea; --muted: #9aa2ad;
      --line: #2e333a; --accent: #60a5fa; --warn: #f87171; --warn-bg: #2a1a1a;
      --ok: #4ade80; --ok-bg: #14261a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
         background: var(--bg); color: var(--ink);
         font: 14px/1.65 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header, footer { background: var(--card); padding: 10px 16px; display: flex;
                   align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; z-index: 1; }
  header { top: 0; border-bottom: 1px solid var(--line); }
  footer { bottom: 0; border-top: 1px solid var(--line); }
  button, input { font: inherit; }
  button { border: 1px solid var(--line); background: var(--card); color: var(--ink);
           border-radius: 6px; padding: 4px 11px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { color: #fff; opacity: .9; }
  button.small { font-size: 12px; padding: 1px 8px; }
  input[type=date], input[type=number] { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
                     background: var(--card); color: var(--ink); }
  .numbers { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .numbers input { width: 90px; }
  .day-total { font-size: 13px; font-weight: normal; color: var(--muted); margin-left: 8px; }
  .submit-results { white-space: pre-wrap; }
  .status { color: var(--muted); font-size: 13px; white-space: pre-wrap; }
  .grow { flex: 1; }
  main { flex: 1; width: 100%; max-width: 920px; margin: 0 auto; padding: 8px 16px 24px; }
  h2 { font-size: 15px; margin: 22px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
          padding: 12px 14px; margin-bottom: 10px; }
  .card.flagged { border-color: var(--warn); }
  .title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .title b { font-size: 14px; }
  .sub { color: var(--muted); font-size: 12px; }
  .tag { font-size: 12px; border-radius: 4px; padding: 0 6px; }
  .tag.filled { color: var(--ok); background: var(--ok-bg); }
  .tag.warn { color: var(--warn); background: var(--warn-bg); }
  .field { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; }
  .field pre { flex: 1; margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
  .label { color: var(--muted); font-size: 12px; width: 56px; flex: none; padding-top: 2px; }
  .problems { color: var(--warn); font-size: 12.5px; margin-top: 8px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
           padding: 14px 16px; margin-top: 16px; }
  .panel.error { border-color: var(--warn); background: var(--warn-bg); }
  .panel-head { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .panel-head .elapsed { color: var(--muted); font-weight: normal; font-size: 13px; }
  .steps { list-style: none; margin: 10px 0 0; padding: 0; }
  .steps li { display: flex; gap: 8px; padding: 3px 0; color: var(--muted); }
  .steps li.current { color: var(--ink); }
  .steps li .mark { width: 16px; flex: none; text-align: center; }
  .steps li.done .mark { color: var(--ok); }
  .error-text { color: var(--warn); margin-top: 10px; white-space: pre-wrap; }
  .spinner { display: inline-block; vertical-align: -2px;
             width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .summary { color: var(--ok); }
  .gaps { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn);
          border-radius: 8px; padding: 12px 16px; margin-top: 16px; }
  .gaps ul { margin: 8px 0 0; padding-left: 20px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <button data-range="week">本周</button>
  <button data-range="last-week">上周</button>
  <input type="date" id="since"> ~ <input type="date" id="until">
  <button class="primary" id="pull">拉取并生成</button>
  <span class="status" id="status"></span>
</header>

<main id="main"></main>

<footer>
  <button class="primary" id="submit">一键提交当前区间</button>
  <button id="retry-unknown" title="核实后再次发送仍未确认的工单">已核实未提交，重试</button>
  <span class="grow"></span>
  <button id="copy-all">复制全文</button>
  <button id="download">下载 .md</button>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const state = { days: [], gaps: [], submitGaps: [], busy: false, edits: new Map(), submitResults: [] };
const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    const text = await res.text();
    let message = text;
    try { message = JSON.parse(text).error ?? text; } catch { /* 非 JSON 错误保留原文 */ }
    throw new Error(message);
  }
  return res.json();
}

function esc(text) {
  return String(text ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function status(text) {
  $('status').textContent = text;
}

function field(label, text) {
  return `<div class="field"><span class="label">${label}</span><pre>${esc(text)}</pre>`
    + `<button class="small" data-copy="${esc(text)}">复制</button></div>`;
}

function renderOrder(order, day) {
  const p = order.progress;
  const sub = [order.projectName, order.taskTitle].filter(Boolean).join(' · ');
  const tags = [];
  if (p && p.source === 'ai') tags.push('<span class="tag">数值为估算，可调整</span>');
  if (p && p.source === 'eom') tags.push('<span class="tag filled">EOM 已填</span>');
  if (p && p.source === 'amend') tags.push(`<span class="tag">待修正，原 ${esc(p.originalRate ?? '缺失')}%</span>`);
  if (p && p.problems.length) tags.push('<span class="tag warn">需复核</span>');
  const head = `<div class="title"><b>${esc(order.title)}</b>${tags.join('')}`
    + `<span class="sub">${esc(sub)}</span></div>`;
  if (!p || !p.memo) {
    const reason = p && p.problems.length ? p.problems.join('；') : '尚未生成';
    return `<div class="card flagged">${head}<div class="problems">${esc(reason)}</div></div>`;
  }
  const problems = p.problems.length ? `<div class="problems">${esc(p.problems.join('；'))}</div>` : '';
  return `<div class="card${p.problems.length ? ' flagged' : ''}">${head}`
    + field('今日进展', p.memo) + field('存在问题', p.issue) + field('明日计划', p.plan)
    + numericFields(order, day) + problems + '</div>';
}

function numericFields(order, day) {
  const p = order.progress;
  if (p.source !== 'ai' && p.source !== 'amend') {
    return `<div class="numbers">工单进展：${esc(p.rate ?? '缺失')}% · 工时：${esc(p.hours ?? '缺失')}h</div>`;
  }
  const edit = state.edits.get(`${day}:${order.id}`);
  const values = edit ?? { rate: p.rate ?? '', hours: p.hours ?? '' };
  return `<div class="numbers" data-day="${esc(day)}" data-order="${esc(order.id)}">`
    + `<label>工单进展 <input aria-label="工单进展百分比" name="rate" type="number" min="0" max="100" step="any" required value="${esc(values.rate)}">%</label>`
    + `<label>工时 <input aria-label="工单工时" name="hours" type="number" min="0" max="7.5" step="any" required${p.source === 'amend' ? ' readonly' : ''} value="${esc(values.hours)}">h</label>`
    + `<button class="small" data-save>保存数值${edit ? '（未保存）' : ''}</button></div>`;
}

function render() {
  let content = '';
  if (state.gaps.length) {
    content += `<div class="gaps"><b>生成所需配置尚未补齐，仍可查看本地报告</b><ul>${
      state.gaps.map((g) => `<li><code>${esc(g)}</code></li>`).join('')
    }</ul><p>在项目根目录的 <code>.env</code> 里补齐后重启即可。</p></div>`;
  }
  if (state.submitGaps.length) {
    content += `<div class="gaps">提交所需配置：${esc(state.submitGaps.join('；'))}</div>`;
  }
  if (state.submitResults.length) {
    const labels = { submitted: '已提交', skipped: '已有日报，跳过', blocked: '校验阻止', failed: '提交失败', conflict: '内容冲突', unknown: '结果待核实', ready: '预检通过' };
    content += `<div class="panel submit-results">${state.submitResults.map((result) =>
      `${esc(result.day)}：${esc(labels[result.status] ?? result.status)}${result.message ? '；' + esc(result.message) : ''}`
    ).join('\n')}</div>`;
  }
  if (!state.days.length) {
    content += '<div class="empty">这个区间还没有内容，运行技能生成或点「拉取并生成」开始。</div>';
  } else {
    content += state.days.map((day) => {
      const week = WEEKDAYS[new Date(`${day.day}T00:00:00`).getDay()];
      const known = day.orders.filter((o) => Number.isFinite(o.progress?.hours));
      const total = known.reduce((sum, o) => sum + o.progress.hours, 0);
      const pending = known.length !== day.orders.length ? '，工时待补齐' : '';
      return `<h2>${day.day} 周${week}<span class="day-total">已保存工时 ${Number(total.toFixed(4))} / 7.5h${pending}</span></h2>`
        + day.orders.map((order) => renderOrder(order, day.day)).join('');
    }).join('');
  }
  $('main').innerHTML = content;
  updateControls();
}

async function load() {
  const data = await api('/api/state');
  $('since').value = data.range.since;
  $('until').value = data.range.until;
  state.days = data.days;
  state.gaps = data.gaps;
  state.submitGaps = data.submitGaps;
  render();
}

async function setPeriod(payload) {
  if (state.busy) return;
  if (state.edits.size) { status('请先保存数值修改，再切换日期。'); return; }
  setBusy(true);
  try {
    await api('/api/period', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    state.submitResults = [];
    status('');
  } catch (err) {
    status(`出错：${err.message}`);
  } finally {
    try { await load(); } finally { setBusy(false); }
  }
}

async function stream(path, body, onEvent) {
  const res = await fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const message = await res.json();
    throw new Error(message.error ?? '生成请求失败');
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const frames = buffer.split('\n\n');
    buffer = frames.pop();
    for (const frame of frames) {
      const line = frame.replace(/^data: /, '');
      if (line) onEvent(JSON.parse(line));
    }
  }
}

// 进度行形如「阶段：详情」，同一阶段的新消息覆盖旧的，换阶段时上一行标为完成
const run = { steps: [], error: '', started: 0, timer: null };

function elapsed() {
  const s = Math.floor((Date.now() - run.started) / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function addStep(text) {
  const stage = text.split('：')[0];
  const last = run.steps[run.steps.length - 1];
  if (last && last.stage === stage) last.text = text;
  else run.steps.push({ stage, text });
}

function renderRun() {
  const failed = Boolean(run.error);
  const items = run.steps.map((step, i) => {
    const current = !failed && i === run.steps.length - 1;
    const mark = current ? '<span class="spinner"></span>' : (failed && i === run.steps.length - 1 ? '✕' : '✓');
    return `<li class="${current ? 'current' : 'done'}"><span class="mark">${mark}</span>${esc(step.text)}</li>`;
  }).join('');
  const head = failed ? '生成失败' : '正在拉取并生成';
  $('main').innerHTML = `<div class="panel${failed ? ' error' : ''}">`
    + `<div class="panel-head">${failed ? '' : '<span class="spinner"></span>'}${head}`
    + `<span class="elapsed">已用时 ${elapsed()}</span></div>`
    + `<ul class="steps">${items}</ul>`
    + (failed ? `<div class="error-text">${esc(run.error)}</div>` : '')
    + '</div>';
}

function setBusy(busy) {
  state.busy = busy;
  document.querySelectorAll('button, input').forEach((el) => { el.disabled = busy; });
  updateControls();
}

function updateControls() {
  $('pull').disabled = state.busy || Boolean(state.gaps.length) || Boolean(state.edits.size);
  const cannotSubmit = state.busy || Boolean(state.submitGaps.length) || !state.days.length || Boolean(state.edits.size);
  $('submit').disabled = cannotSubmit;
  $('retry-unknown').disabled = cannotSubmit;
}

$('pull').onclick = async () => {
  if (state.busy || state.edits.size) return;
  state.submitResults = [];
  setBusy(true);
  Object.assign(run, { steps: [], error: '', started: Date.now() });
  status('');
  renderRun();
  run.timer = setInterval(renderRun, 1000);
  let summary = '';
  try {
    await stream('/api/sync', { since: $('since').value, until: $('until').value }, (e) => {
      if (e.type === 'progress') addStep(e.text);
      if (e.type === 'summary') summary = e.text;
      if (e.type === 'error') run.error = e.message;
      renderRun();
    });
  } catch (err) {
    run.error = `连接中断：${err.message}`;
  } finally {
    clearInterval(run.timer);
    setBusy(false);
  }
  if (run.error) { renderRun(); return; }
  await load();
  $('status').innerHTML = `<span class="summary">✓ ${esc(summary)}（用时 ${elapsed()}）</span>`;
};

document.querySelectorAll('[data-range]').forEach((btn) => {
  btn.onclick = () => setPeriod({ shortcut: btn.dataset.range });
});
['since', 'until'].forEach((id) => {
  $(id).onchange = () => setPeriod({ since: $('since').value, until: $('until').value });
});

$('main').addEventListener('input', (e) => {
  const row = e.target.closest('.numbers[data-day]');
  if (!row) return;
  state.edits.set(`${row.dataset.day}:${row.dataset.order}`, {
    rate: row.querySelector('[name=rate]').value,
    hours: row.querySelector('[name=hours]').value,
  });
  row.querySelector('[data-save]').textContent = '保存数值（未保存）';
  status('数值已修改，请保存后提交。');
  updateControls();
});

$('main').addEventListener('click', async (e) => {
  if (state.busy) return;
  const save = e.target.closest('[data-save]');
  if (save) {
    const row = save.closest('.numbers');
    const inputs = [...row.querySelectorAll('input')];
    if (!inputs.every((input) => input.reportValidity())) return;
    const key = `${row.dataset.day}:${row.dataset.order}`;
    setBusy(true);
    try {
      await api('/api/progress', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ day: row.dataset.day, orderId: row.dataset.order,
          rate: Number(inputs[0].value), hours: Number(inputs[1].value) }),
      });
      state.edits.delete(key);
      state.submitResults = [];
      await load();
      status(state.edits.size ? '数值已保存；其他修改仍需保存。' : '数值已保存，并重新校验。');
    } catch (err) { status(`保存失败：${err.message}`); }
    finally { setBusy(false); }
    return;
  }
  const copy = e.target.closest('[data-copy]');
  if (!copy) return;
  try {
    await navigator.clipboard.writeText(copy.dataset.copy);
    copy.textContent = '已复制';
    setTimeout(() => { copy.textContent = '复制'; }, 1200);
  } catch (err) { status(`复制失败：${err.message}`); }
});

async function submit(retryUnknown = false) {
  if (state.busy || state.edits.size) return;
  if (retryUnknown && !confirm('请先在 EOM 核实尚未提交。此操作会再次发送仍未确认的工单，是否重试？')) return;
  setBusy(true);
  status('正在核对排期并提交，请稍候。');
  try {
    const result = await api('/api/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ since: $('since').value, until: $('until').value, retryUnknown }),
    });
    state.submitResults = result.days;
    await load();
    status('提交处理完成，逐日结果见上方。');
  } catch (err) {
    status(`提交中断：${err.message}。请先核对 EOM 中的实际结果，再重试。`);
  } finally { setBusy(false); }
}

$('submit').onclick = () => submit();
$('retry-unknown').onclick = () => submit(true);

$('copy-all').onclick = async () => {
  const res = await fetch('/api/export');
  await navigator.clipboard.writeText(await res.text());
  status('已复制全文');
};

$('download').onclick = () => {
  window.location = '/api/export?download=1';
};

load().catch((err) => status(`加载失败：${err.message}`));
</script>
</body>
</html>
