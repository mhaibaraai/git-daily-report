[project]
name = "git-daily-report"
version = "0.1.0"
description = "按 EOM 日程表与 GitLab 提交，用 AI 生成每周的工单进展"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "openai>=1.0",
]

[project.scripts]
dr = "git_daily_report.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_daily_report"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=git_daily_report --cov-report=term-missing"

[tool.coverage.run]
source = ["src/git_daily_report"]
